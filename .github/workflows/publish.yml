name: Publish Image

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public direct URL of the image"
        required: true
        type: string
      filename:
        description: "Image filename, for example nature-mountain.jpg"
        required: true
        type: string
      metadata:
        description: "Image metadata JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image
        env:
          IMAGE_URL: ${{ inputs.image_url }}
          FILENAME: ${{ inputs.filename }}
        run: |
          mkdir -p images

          curl -L --fail --retry 3 \
            "$IMAGE_URL" \
            -o "images/$FILENAME"

          echo "Image downloaded successfully."

      - name: Update images.json
        env:
          FILENAME: ${{ inputs.filename }}
          METADATA: ${{ inputs.metadata }}
        run: |
          python - <<'PY'
          import json
          import os

          path = "data/images.json"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  images = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              images = []

          metadata = json.loads(os.environ["METADATA"])

          metadata["image"] = "images/" + os.environ["FILENAME"]

          images.append(metadata)

          with open(path, "w", encoding="utf-8") as f:
              json.dump(images, f, ensure_ascii=False, indent=2)

          print("Image metadata added successfully.")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/ data/images.json

          git diff --cached --quiet || git commit -m "Publish new image"

          git push
